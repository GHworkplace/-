<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>🦞 CS2 战队 BP 策略分析与对战战局沙盘推演系统</title>

  <!-- Modern Typography from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="./src/css/style.css">

<body class="tactical-dark-theme">
  <!-- Layout Wrapper -->
  <div class="app-layout">
    <!-- App Header -->
    <header class="app-header">
      <div class="header-brand">
        <span class="brand-lobster">🦞</span>
        <h1 class="brand-title">小龙虾 <span class="glow-text text-green">CS2 BP</span> 策略分析与沙盘推演系统</h1>
      </div>

      <!-- Navigation Tabs Router -->
      <nav class="header-nav">
        <button id="tab-btn-dashboard" class="nav-tab-btn active" id="tab-dashboard">
          <span class="tab-icon">📊</span> 战队数据看板
        </button>
        <button id="tab-btn-simulator" class="nav-tab-btn" id="tab-simulator">
          <span class="tab-icon">🎯</span> 智能 BP 模拟器
        </button>
        <button id="tab-btn-sandbox" class="nav-tab-btn" id="tab-sandbox">
          <span class="tab-icon">🎮</span> 战局沙盘推演

    <!-- App Footer -->
    <footer class="app-footer">
      <div class="footer-container">
        <span class="footer-text">© 2026 小龙虾 CS2 策略沙盘推演项目组. 离线原生版.</span>

  <script type="module" src="./src/js/main.js"></script>
